<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Tribute to Farmers - Class 6 SST Exhibition Scanning Qr Made By Ayaan Patel 7A</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f1f8e9 0%, #fffde7 100%);
      color: #1b5e20;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .container {

      border-radius: 20px;

      max-width: 720px;
      width: 100%;
      border: 3px solid #81c784;
    }

    h1 {
      font-size: 2rem;
      color: #2e7d32;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    h2 {
      font-size: 1.25rem;
      color: #f57f17;
      font-weight: 600;
      margin-bottom: 22px;
    }

    .video-box {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
    }

    video {
      width: 100%;
      max-height: 75vh;
      display: block;
    }

</head>

  <div class="container">
